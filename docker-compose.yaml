services:
  mana:
    build:
      context: .
    image: mana:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      CONTENT_DIR: /app/content
    volumes:
      # Mount the directory so atomic file replacements by editors remain visible.
      - ./content:/app/content:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
